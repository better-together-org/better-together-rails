name: Greetings

on: [pull_request, issues]

jobs:
  greeting:
    # Skip BTS Robot's own PRs and issues; it would be greeted again on every new PR.
    if: ${{ github.event.pull_request.user.login != 'bettertogether-bts-robot' && github.event.issue.user.login != 'bettertogether-bts-robot' }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/first-interaction@v3
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        issue_message: 'Thanks for helping us all be Better Together! It looks like this is your first time creating an issue in this repository. Please be sure to read the code of conduct and take a look for existing issues when you''re ready to contribute!'
        pr_message: 'Thanks for you contribution! We couldn''t do this without the support of awesome people like you!'
