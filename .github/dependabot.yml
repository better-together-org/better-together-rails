version: 2
updates:
- package-ecosystem: bundler
  directory: "/"
  schedule:
    interval: daily
  open-pull-requests-limit: 10
  groups:
    # Security fixes land together; version updates stay one PR per gem so a
    # single bad bump never blocks the rest.
    security-updates:
      applies-to: security-updates
      patterns:
      - "*"
  ignore:
  # better_together is bumped by hand: new CE versions can carry migrations
  # that must be installed and reviewed first, which Dependabot cannot detect.
  - dependency-name: better_together
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: weekly
- package-ecosystem: npm
  directory: "/"
  schedule:
    interval: weekly
